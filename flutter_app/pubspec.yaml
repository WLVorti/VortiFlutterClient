name: vorti_messenger
description: "Mobile messenger client for vortiMes"
publish_to: 'none'
version: 1.0.2+2

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # Networking
  web_socket_channel: ^2.4.0
  http: ^1.2.0
  http_parser: ^4.0.2
  
  # File picker
  file_picker: ^8.0.0
  image_picker: ^1.0.0
  
  # Storage
  shared_preferences: ^2.2.0
  sqflite: ^2.3.0
  path_provider: ^2.1.0
  path: ^1.9.0
  
  # Utils
  uuid: ^4.2.0
  intl: ^0.20.2
  app_links: ^6.3.3
  url_launcher: ^6.3.0
  
  # UI
  flutter_secure_storage: ^9.0.0
  cached_network_image: ^3.3.0
  video_player: ^2.8.0
  video_thumbnail: ^0.5.3
  flutter_image_compress: ^2.4.0
  just_audio: ^0.9.40
  audio_waveforms: ^1.2.0
  permission_handler: ^11.3.1
  image_cropper_widget: ^1.0.7
  photo_manager: ^3.6.0
  
  # WebRTC
  flutter_webrtc: ^0.12.0
  
  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.0
  google_sign_in: ^6.3.0
  firebase_messaging: ^15.2.5
  flutter_local_notifications: ^18.0.1
  pinenacl: ^0.6.0
  crypto: ^3.0.6
  camera: ^0.12.0+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/icon.png"
